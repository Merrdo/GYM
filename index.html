<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Antrenman</title>
<!-- viewport-fit=cover: içerik çentik/ada ve ev çubuğu altına kadar uzanır -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0c0f13">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Antrenman">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #0c0f13;
    --surface: #151a21;
    --surface2: #1d242d;
    --line: rgba(255,255,255,.07);
    --ink: #eef1f4;
    --dim: #8b96a3;
    --accent: #d4ff3f;
    --accent-ink: #0c0f13;
    --danger: #ff6a5e;
    --ease: cubic-bezier(.32,.72,0,1);
    /* Safe area kullanılmıyor: sabit boşluklar. Arka plan ve içerik uçlara kadar uzanır */
    --pt: 52px;   /* başlıkların üst boşluğu */
    --pb: 36px;   /* butonların ekran altından yüksekliği */
  }
  /* Tarayıcıda (kurulu uygulama değil) Safari kendi çubuklarını yönetir; boşluklar küçülür */
  html.browser { --pt: 24px; --pb: 20px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Tam ekran düzeni: html/body/stage yapısı korunuyor */
  html, body {
    width: 100%;
    height: var(--full-h, 100%);
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    overflow: hidden;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: var(--full-h, 100%);
    overflow: hidden;
  }
  /* Klavye açılıp kapanırken yükseklik yumuşakça değişir (ilk açılışta animasyon yok) */
  html.ready .stage { transition: height .32s cubic-bezier(.22,.9,.24,1); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, textarea { font: inherit; color: inherit; -webkit-user-select: text; user-select: text; }
  b { font-weight: 700; font-variant-numeric: tabular-nums; }

  /* ---------- Görünümler ---------- */
  .view {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    background: var(--bg);
    will-change: transform;
  }
  #group { display: none; z-index: 10; }
  .dim { position: absolute; inset: 0; background: rgba(0,0,0,.5); z-index: 9; pointer-events: none; }
  /* Sol kenar şeridi: tarayıcının kendi kaydırma/geri hareketini engeller, geri hareketini biz yönetiriz */
  .edge { position: absolute; left: 0; top: 0; bottom: 0; width: 18px; z-index: 60; touch-action: none; }
  html.kbd .bar { opacity: 0; transition: opacity .2s; }

  .scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 4px 20px calc(var(--pb) + 54px + 32px); }

  .top { padding: var(--pt) 20px 14px; display: flex; align-items: center; gap: 12px; flex: none; }
  .top h1 { font-size: 1.7rem; letter-spacing: -.03em; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top .sub { color: var(--dim); font-size: .85rem; margin-top: 2px; font-weight: 500; letter-spacing: 0; }
  .top .ttl { flex: 1; min-width: 0; }
  .top .ttl h1 { display: block; }
  .icon-btn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); transition: transform .15s var(--ease), background .2s; flex: none; }
  .icon-btn:active { transform: scale(.9); background: var(--surface2); }
  .icon-btn svg { width: 20px; height: 20px; }
  .eyebrow { color: var(--dim); font-size: .8rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }

  /* Buton listenin üstünde yüzer; liste ekranın en altına kadar uzanır */
  .bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 20px var(--pb); z-index: 5; pointer-events: none; }
  .bar::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--pb) + 54px + 40px); background: linear-gradient(to top, var(--bg) 35%, rgba(12,15,19,0)); z-index: -1; }
  .bar .primary { pointer-events: auto; }
  .primary {
    width: 100%; height: 54px; border-radius: 16px;
    background: var(--accent); color: var(--accent-ink);
    font-weight: 700; font-size: 1rem; letter-spacing: -.01em;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .15s var(--ease), filter .2s;
  }
  .primary:active { transform: scale(.975); filter: brightness(.92); }
  .primary svg { width: 18px; height: 18px; }

  /* ---------- Kartlar ---------- */
  .card {
    width: 100%; text-align: left; display: flex; align-items: center; gap: 14px;
    background: var(--surface); border-radius: 18px; padding: 16px 18px; margin-bottom: 10px;
    transition: transform .18s var(--ease), background .2s;
  }
  .card:active { transform: scale(.98); background: var(--surface2); }
  .card.in { animation: rise .5s var(--ease) both; animation-delay: calc(var(--i) * 45ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .grp .gi { flex: 1; min-width: 0; }
  .grp .name { font-size: 1.1rem; font-weight: 650; letter-spacing: -.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grp .sub { color: var(--dim); font-size: .85rem; margin-top: 3px; }
  .grp svg { width: 18px; height: 18px; color: var(--dim); flex: none; }

  .ex { align-items: flex-start; }
  .ex .idx { font-variant-numeric: tabular-nums; color: var(--dim); font-size: .8rem; font-weight: 600; padding-top: 3px; width: 22px; flex: none; }
  .ex .bd { flex: 1; min-width: 0; }
  .ex .name { font-size: 1.05rem; font-weight: 650; letter-spacing: -.02em; }
  .ex .desc { color: var(--dim); font-size: .88rem; line-height: 1.4; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip { background: var(--surface2); border-radius: 8px; padding: 5px 10px; font-size: .82rem; color: var(--dim); font-weight: 500; }
  .chip b { color: var(--ink); }
  .chip.main { background: rgba(212,255,63,.12); color: var(--accent); }
  .chip.main b { color: var(--accent); }

  .empty { text-align: center; color: var(--dim); padding: 14vh 24px 0; line-height: 1.5; animation: rise .6s var(--ease) both; }
  .empty h2 { color: var(--ink); font-size: 1.2rem; letter-spacing: -.02em; margin-bottom: 6px; }

  /* ---------- Alt sayfa (sheet) ---------- */
  .backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .35s var(--ease); z-index: 20; }
  .sheet-wrap.open .backdrop { opacity: 1; pointer-events: auto; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 21;
    max-height: 92%;
    display: flex; flex-direction: column;
    background: var(--surface); border-radius: 26px 26px 0 0;
    transform: translateY(105%); visibility: hidden;
    transition: transform .45s var(--ease), visibility 0s .45s;
  }
  .sheet-wrap.open .sheet { transform: none; visibility: visible; transition: transform .45s var(--ease), visibility 0s 0s; }
  .grab { touch-action: none; width: 38px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.18); margin: 10px auto 0; flex: none; }
  .sh-head { touch-action: none; display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 8px; flex: none; }
  .sh-head h2 { font-size: 1.25rem; letter-spacing: -.02em; }
  .sh-head .icon-btn { background: var(--surface2); width: 36px; height: 36px; }
  .sh-head .icon-btn svg { width: 16px; height: 16px; }
  .sh-body { overflow-y: auto; overscroll-behavior: contain; padding: 8px 20px 12px; flex: 1; }
  html.kbd .sh-foot { padding-bottom: 12px; }
  .sh-foot { transition: padding .34s cubic-bezier(.22,.8,.3,1); padding: 10px 20px var(--pb); display: flex; flex-direction: column; gap: 8px; flex: none; }
  .ghost { height: 46px; border-radius: 14px; font-weight: 600; color: var(--danger); transition: background .2s, transform .15s var(--ease); }
  .ghost:active { transform: scale(.97); }
  .ghost.confirm { background: rgba(255,106,94,.14); }

  /* ---------- Form ---------- */
  .field { margin-bottom: 18px; }
  .field > label { display: block; color: var(--dim); font-size: .78rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; }
  .input {
    width: 100%; background: var(--surface2); border: 1.5px solid transparent; border-radius: 14px;
    padding: 14px 16px; font-size: 1rem; outline: none; resize: none; transition: border-color .2s;
  }
  .input:focus { border-color: rgba(212,255,63,.55); }
  textarea.input { min-height: 96px; line-height: 1.45; }
  .input::placeholder { color: #566170; }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }

  .seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; background: var(--surface2); border-radius: 14px; padding: 4px; }
  .seg i { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); background: var(--bg); border-radius: 10px; transition: transform .35s var(--ease); }
  .seg.r i { transform: translateX(100%); }
  .seg button { position: relative; z-index: 1; height: 40px; font-weight: 600; color: var(--dim); transition: color .25s; }
  .seg button.on { color: var(--ink); }

  .stepper { display: flex; align-items: center; background: var(--surface2); border-radius: 14px; padding: 4px; }
  .stepper button { width: 48px; height: 44px; border-radius: 10px; font-size: 1.4rem; font-weight: 500; display: grid; place-items: center; transition: background .15s, transform .12s var(--ease); touch-action: none; }
  .stepper button:active { background: var(--bg); transform: scale(.92); }
  .stepper .val { flex: 1; text-align: center; font-size: 1.05rem; color: var(--dim); font-weight: 500; }
  .stepper .val b { color: var(--ink); font-size: 1.15rem; }
  .stepper .val.pop b { animation: pop .18s var(--ease); display: inline-block; }
  @keyframes pop { from { transform: scale(1.18); } to { transform: none; } }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .hide { display: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">

  <!-- Ana ekran: gruplar -->
  <section class="view" id="home">
    <div class="top">
      <div class="ttl">
        <div class="eyebrow">Antrenman</div>
        <h1>Gruplarım</h1>
      </div>
    </div>
    <div class="scroll" id="homeList"></div>
    <div class="bar">
      <button class="primary" id="addGroup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Yeni grup</button>
    </div>
  </section>

  <!-- Grup ekranı: hareketler -->
  <section class="view" id="group">
    <div class="top">
      <button class="icon-btn" id="back" aria-label="Geri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="ttl"><h1 id="gTitle"></h1><div class="sub" id="gSub"></div></div>
      <button class="icon-btn" id="editGroup" aria-label="Grubu düzenle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 00-4-4L4 16v4z"/></svg></button>
    </div>
    <div class="scroll" id="groupList"></div>
    <div class="bar">
      <button class="primary" id="addEx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Hareket ekle</button>
    </div>
  </section>

  <!-- Alt sayfa -->
  <div class="sheet-wrap" id="sheetWrap">
    <div class="backdrop" id="backdrop"></div>
    <div class="sheet" role="dialog">
      <div class="grab"></div>
      <div class="sh-head"><h2 id="shTitle"></h2>
        <button class="icon-btn" id="shClose" aria-label="Kapat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="sh-body" id="shBody"></div>
      <div class="sh-foot" id="shFoot"></div>
    </div>
  </div>
</div>

<script>
(function () {
  /* ================= Veri ================= */
  var KEY = 'antrenman.v1';
  var state = load();
  function load() {
    try { var d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.groups)) return d; } catch (e) {}
    return { groups: [] };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function findGroup(id) { return state.groups.filter(function (g) { return g.id === id; })[0]; }

  /* ================= Biçimlendirme ================= */
  function fmtTime(s) {
    var m = Math.floor(s / 60), r = s % 60;
    if (m && r) return m + ' dk ' + r + ' sn';
    if (m) return m + ' dk';
    return r + ' sn';
  }
  function bold(t) { return String(t).replace(/(\d+)/g, '<b>$1</b>'); }
  var CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';

  /* ================= Ekranlar ================= */
  var stage = $('#stage'), curId = null;

  function renderHome(animate) {
    var el = $('#homeList');
    if (!state.groups.length) {
      el.innerHTML = '<div class="empty"><h2>Henüz grup yok</h2>Antrenmanını gruplara ayır.<br>Örn. “Üst vücut” veya “Sabah esneme”.</div>';
      return;
    }
    el.innerHTML = state.groups.map(function (g, i) {
      var sets = g.exercises.reduce(function (a, e) { return a + e.sets; }, 0);
      var sub = g.exercises.length ? g.exercises.length + ' hareket · ' + sets + ' set' : 'Henüz hareket yok';
      return '<button class="card grp' + (animate ? ' in' : '') + '" data-id="' + g.id + '" style="--i:' + i + '"><div class="gi"><div class="name">' + esc(g.name) + '</div><div class="sub">' + sub + '</div></div>' + CHEV + '</button>';
    }).join('');
  }

  function renderGroup(animate) {
    var g = findGroup(curId); if (!g) return;
    $('#gTitle').textContent = g.name;
    var sets = g.exercises.reduce(function (a, e) { return a + e.sets; }, 0);
    $('#gSub').textContent = g.exercises.length ? g.exercises.length + ' hareket · ' + sets + ' set' : 'Henüz hareket yok';
    var el = $('#groupList');
    if (!g.exercises.length) {
      el.innerHTML = '<div class="empty"><h2>Bu grup boş</h2>İlk hareketini ekleyerek başla.</div>';
      return;
    }
    el.innerHTML = g.exercises.map(function (e, i) {
      var main = e.type === 'time' ? fmtTime(e.value) : e.value + ' tekrar';
      var chips = '<span class="chip main">' + bold(main) + '</span><span class="chip">' + bold(e.sets + ' set') + '</span>';
      if (e.rest > 0) chips += '<span class="chip">' + bold(fmtTime(e.rest)) + ' dinlenme</span>';
      return '<button class="card ex' + (animate ? ' in' : '') + '" data-id="' + e.id + '" style="--i:' + i + '">' +
        '<span class="idx">' + String(i + 1).padStart(2, '0') + '</span><div class="bd"><div class="name">' + esc(e.name) + '</div>' +
        (e.desc ? '<div class="desc">' + esc(e.desc) + '</div>' : '') + '<div class="chips">' + chips + '</div></div></button>';
    }).join('');
  }

  /* ================= Sayfa geçişleri (Web Animations) ================= */
  var EASE = 'cubic-bezier(.22,.9,.24,1)';
  var homeView = $('#home'), groupView = $('#group'), groupOpen = false, dimEl = null, homeAnim = null;

  function openGroup(id) {
    curId = id; renderGroup(true);
    $('#groupList').scrollTop = 0;
    groupView.style.display = 'flex';
    dimEl = document.createElement('div'); dimEl.className = 'dim';
    stage.insertBefore(dimEl, groupView);
    dimEl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 480, easing: EASE });
    groupView.animate([{ transform: 'translateX(100%)' }, { transform: 'none' }], { duration: 480, easing: EASE });
    homeAnim = homeView.animate([{ transform: 'none' }, { transform: 'translateX(-22%)' }], { duration: 480, easing: EASE, fill: 'forwards' });
    homeView.inert = true; groupOpen = true;
  }
  function closeGroup(from, pf, dimFrom) {
    if (!groupOpen) return;
    groupOpen = false;
    var a = groupView.animate([{ transform: from || 'none' }, { transform: 'translateX(100%)' }], { duration: 400, easing: EASE, fill: 'forwards' });
    homeView.animate([{ transform: pf || 'translateX(-22%)' }, { transform: 'none' }], { duration: 400, easing: EASE });
    if (homeAnim) { homeAnim.cancel(); homeAnim = null; }
    var d = dimEl; dimEl = null;
    if (d) d.animate([{ opacity: dimFrom == null ? 1 : dimFrom }, { opacity: 0 }], { duration: 400, easing: EASE, fill: 'forwards' }).onfinish = function () { d.remove(); };
    homeView.inert = false;
    a.onfinish = function () { groupView.style.display = 'none'; a.cancel(); };
  }

  // Soldan çekerek geri: sayfa parmağı takip eder, alttaki sayfa hafifçe paralaks yapar
  (function () {
    var strip = document.createElement('div'); strip.className = 'edge'; groupView.appendChild(strip);
    var sx = null, dx = 0, t0 = 0, W = 1;
    function prevT(p) { return 'translate3d(' + (-0.22 * W * (1 - p)) + 'px,0,0)'; }
    strip.addEventListener('touchstart', function (e) {
      if (!groupOpen || sheetOpen || sx != null) return;
      sx = e.touches[0].clientX; dx = 0; t0 = Date.now(); W = groupView.offsetWidth || innerWidth;
      if (homeAnim) { homeAnim.cancel(); homeAnim = null; }
      homeView.style.transform = prevT(0);
    }, { passive: true });
    strip.addEventListener('touchmove', function (e) {
      if (sx == null) return;
      dx = Math.min(W, Math.max(0, e.touches[0].clientX - sx)); var p = dx / W;
      groupView.style.transform = 'translate3d(' + dx + 'px,0,0)';
      homeView.style.transform = prevT(p);
      if (dimEl) dimEl.style.opacity = 1 - p;
    }, { passive: true });
    function end(cancel) {
      if (sx == null) return;
      var v = dx / Math.max(1, Date.now() - t0), p = dx / W; sx = null;
      var from = 'translate3d(' + dx + 'px,0,0)', pf = prevT(p);
      groupView.style.transform = ''; homeView.style.transform = '';
      if (dimEl) dimEl.style.opacity = '';
      if (!cancel && (dx > W * .33 || v > .6)) { closeGroup(from, pf, 1 - p); }
      else {
        if (dx > 0) groupView.animate([{ transform: from }, { transform: 'none' }], { duration: 320, easing: EASE });
        homeAnim = homeView.animate([{ transform: pf }, { transform: 'translateX(-22%)' }], { duration: 320, easing: EASE, fill: 'forwards' });
        if (dimEl) dimEl.animate([{ opacity: 1 - p }, { opacity: 1 }], { duration: 320, easing: EASE });
      }
    }
    strip.addEventListener('touchend', function () { end(false); });
    strip.addEventListener('touchcancel', function () { end(true); });
  })();

  /* ================= Alt sayfa ================= */
  var onSave = null;
  function openSheet(title, bodyHTML, saveLabel, delLabel, onDelete) {
    $('#shTitle').textContent = title;
    $('#shBody').innerHTML = bodyHTML;
    $('#shBody').scrollTop = 0;
    var foot = '<button class="primary" id="shSave">' + saveLabel + '</button>';
    if (delLabel) foot += '<button class="ghost" id="shDel">' + delLabel + '</button>';
    $('#shFoot').innerHTML = foot;
    $('#shSave').onclick = function () { if (onSave) onSave(); };
    if (delLabel) {
      var d = $('#shDel'), t;
      d.onclick = function () {
        if (!d.classList.contains('confirm')) {
          d.classList.add('confirm'); d.textContent = 'Emin misin? Tekrar dokun';
          t = setTimeout(function () { d.classList.remove('confirm'); d.textContent = delLabel; }, 3000);
        } else { clearTimeout(t); onDelete(); }
      };
    }
    $('#sheetWrap').classList.add('open');
    sheetOpen = true;
  }
  var sheetOpen = false;
  function closeSheet(cb) {
    if (!sheetOpen) { if (cb) cb(); return; }
    sheetOpen = false;
    $('#sheetWrap').classList.remove('open');
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    if (cb) setTimeout(cb, 260);
  }
  $('#shClose').onclick = $('#backdrop').onclick = function () { closeSheet(); };

  // Başlık alanından aşağı çekerek kapat
  (function () {
    var sheet = $('.sheet'), y0 = null, dy = 0, t0 = 0;
    function startDrag(e) { y0 = e.touches[0].clientY; dy = 0; t0 = Date.now(); sheet.style.transition = 'none'; }
    function moveDrag(e) { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); sheet.style.transform = 'translate3d(0,' + dy + 'px,0)'; }
    function endDrag() {
      if (y0 == null) return;
      var v = dy / Math.max(1, Date.now() - t0), close = dy > 100 || v > .6; y0 = null;
      sheet.style.transition = ''; void sheet.offsetWidth; sheet.style.transform = '';
      if (close) closeSheet();
    }
    [$('.grab'), $('.sh-head')].forEach(function (el) {
      el.addEventListener('touchstart', startDrag, { passive: true });
      el.addEventListener('touchmove', moveDrag, { passive: true });
      el.addEventListener('touchend', endDrag); el.addEventListener('touchcancel', endDrag);
    });
  })();
  // Enter tuşu klavyeyi kapatır
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); e.target.blur(); }
  });

  function needName(inp) {
    inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); inp.focus();
  }

  /* ----- Grup formu ----- */
  function groupSheet(id) {
    var g = id ? findGroup(id) : null;
    onSave = function () {
      var inp = $('#fTitle'), v = inp.value.trim();
      if (!v) return needName(inp);
      if (g) { g.name = v; save(); renderHome(false); renderGroup(false); closeSheet(); }
      else {
        var n = { id: uid(), name: v, exercises: [] };
        state.groups.push(n); save(); renderHome(false);
        closeSheet(function () { openGroup(n.id); });
      }
    };
    openSheet(g ? 'Grubu düzenle' : 'Yeni grup',
      '<div class="field"><label for="fTitle">Grup adı</label><input class="input" id="fTitle" maxlength="40" placeholder="Örn. Üst vücut" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" value="' + (g ? esc(g.name) : '') + '"></div>',
      g ? 'Kaydet' : 'Oluştur', g ? 'Grubu sil' : null,
      function () {
        state.groups = state.groups.filter(function (x) { return x.id !== id; });
        save(); renderHome(false); closeSheet(function () { if (groupOpen) closeGroup(); });
      });
  }

  /* ----- Hareket formu ----- */
  var CFG = {
    time: { min: 5, max: 3600, step: 5 },
    reps: { min: 1, max: 999, step: 1 },
    sets: { min: 1, max: 99, step: 1 },
    rest: { min: 0, max: 600, step: 5 }
  };
  function stepperHTML(k) {
    return '<div class="stepper" data-k="' + k + '"><button type="button" data-d="-1" aria-label="Azalt">−</button><div class="val"></div><button type="button" data-d="1" aria-label="Arttır">+</button></div>';
  }

  function exSheet(exId) {
    var g = findGroup(curId); if (!g) return;
    var ex = exId ? g.exercises.filter(function (e) { return e.id === exId; })[0] : null;
    var d = ex ? { name: ex.name, desc: ex.desc || '', type: ex.type, time: ex.type === 'time' ? ex.value : 30, reps: ex.type === 'reps' ? ex.value : 12, sets: ex.sets, rest: ex.rest || 0 }
               : { name: '', desc: '', type: 'time', time: 30, reps: 12, sets: 3, rest: 30 };

    var html =
      '<div class="field"><label for="fTitle">Hareket adı</label><input class="input" id="fTitle" maxlength="50" placeholder="Örn. Şınav" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" value="' + esc(d.name) + '"></div>' +
      '<div class="field"><label for="fDesc">Nasıl yapılır</label><textarea class="input" id="fDesc" maxlength="400" placeholder="Duruş, nefes ve dikkat edilecek noktalar">' + esc(d.desc) + '</textarea></div>' +
      '<div class="field"><label>Ölçü</label><div class="seg" id="seg"><i></i><button type="button" data-t="time">Süre</button><button type="button" data-t="reps">Tekrar</button></div></div>' +
      '<div class="field" id="fTime"><label>Hareket süresi</label>' + stepperHTML('time') + '</div>' +
      '<div class="field hide" id="fReps"><label>Tekrar sayısı</label>' + stepperHTML('reps') + '</div>' +
      '<div class="row2"><div class="field"><label>Set</label>' + stepperHTML('sets') + '</div>' +
      '<div class="field"><label>Set arası dinlenme</label>' + stepperHTML('rest') + '</div></div>';

    function fmtVal(k) {
      if (k === 'time') return bold(fmtTime(d.time));
      if (k === 'reps') return bold(d.reps + ' tekrar');
      if (k === 'sets') return bold(d.sets + ' set');
      return d.rest ? bold(fmtTime(d.rest)) : 'Yok';
    }
    function paint(k, animate) {
      var v = $('.stepper[data-k="' + k + '"] .val'); if (!v) return;
      v.innerHTML = fmtVal(k);
      if (animate) { v.classList.remove('pop'); void v.offsetWidth; v.classList.add('pop'); }
    }
    function paintType() {
      var r = d.type === 'reps';
      $('#seg').classList.toggle('r', r);
      Array.prototype.forEach.call($('#seg').querySelectorAll('button'), function (b) { b.classList.toggle('on', b.dataset.t === d.type); });
      $('#fTime').classList.toggle('hide', r);
      $('#fReps').classList.toggle('hide', !r);
    }

    onSave = function () {
      var inp = $('#fTitle'), v = inp.value.trim();
      if (!v) return needName(inp);
      var o = { id: ex ? ex.id : uid(), name: v, desc: $('#fDesc').value.trim(), type: d.type, value: d.type === 'time' ? d.time : d.reps, sets: d.sets, rest: d.rest };
      if (ex) g.exercises[g.exercises.indexOf(ex)] = o; else g.exercises.push(o);
      save(); renderGroup(false); renderHome(false); closeSheet();
    };

    openSheet(ex ? 'Hareketi düzenle' : 'Yeni hareket', html, ex ? 'Kaydet' : 'Ekle', ex ? 'Hareketi sil' : null, function () {
      g.exercises = g.exercises.filter(function (e) { return e.id !== ex.id; });
      save(); renderGroup(false); renderHome(false); closeSheet();
    });

    ['time', 'reps', 'sets', 'rest'].forEach(function (k) { paint(k); });
    paintType();

    var body = $('#shBody');
    body.onclick = function (e) {
      var b = e.target.closest('#seg button'); if (!b) return;
      d.type = b.dataset.t; paintType();
    };
    // Basılı tutunca hızlı değiştirme
    var tm, iv;
    function stop() { clearTimeout(tm); clearInterval(iv); }
    function bump(k, dir) {
      var c = CFG[k], n = d[k] + dir * c.step;
      d[k] = Math.max(c.min, Math.min(c.max, n)); paint(k, true);
    }
    body.addEventListener('pointerdown', function (e) {
      var b = e.target.closest('.stepper button'); if (!b) return;
      var k = b.parentNode.dataset.k, dir = +b.dataset.d;
      bump(k, dir); stop();
      tm = setTimeout(function () { iv = setInterval(function () { bump(k, dir); }, 80); }, 400);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) { body.addEventListener(t, stop, true); });
    body.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }

  /* ================= Olaylar ================= */
  $('#addGroup').onclick = function () { groupSheet(null); };
  $('#addEx').onclick = function () { exSheet(null); };
  $('#editGroup').onclick = function () { groupSheet(curId); };
  $('#back').onclick = function () { closeGroup(); };
  $('#homeList').addEventListener('click', function (e) {
    var c = e.target.closest('.grp'); if (c) openGroup(c.dataset.id);
  });
  $('#groupList').addEventListener('click', function (e) {
    var c = e.target.closest('.ex'); if (c) exSheet(c.dataset.id);
  });

  /* ================= Tam ekran + klavye ================= */
  var root = document.documentElement;
  var standalone = window.navigator.standalone === true ||
    (window.matchMedia && (matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: standalone)').matches));
  if (!standalone) root.classList.add('browser');
  var maxH = innerHeight;

  // Kurulu uygulamada gerçek ekran yüksekliği, tarayıcıda görünen alan kullanılır.
  // Klavye açıkken uygulama yalnızca klavyenin üstünde kalan alana sığdırılır.
  function fit() {
    var hh = Math.max(innerHeight, root.clientHeight);
    if (standalone) {
      var portrait = innerHeight >= innerWidth;
      hh = Math.max(hh, portrait ? Math.max(screen.height, screen.width) : Math.min(screen.height, screen.width));
    } else { hh = innerHeight; }
    var ae = document.activeElement, vv = window.visualViewport, typing = false;
    if (vv && ae && ae.matches && ae.matches('input,textarea') && vv.height < hh - 80) { hh = Math.round(vv.height + vv.offsetTop); typing = true; }
    root.style.setProperty('--full-h', hh + 'px');
    root.classList.toggle('kbd', typing);
  }
  // iOS ana ekran uygulamasında klavye kapanınca görünüm alt şeritte takılı kalabiliyor: yeniden ölçtür
  function unstick() {
    maxH = Math.max(maxH, innerHeight);
    if (maxH - innerHeight > 4) {
      var keep = [].map.call(document.querySelectorAll('.scroll,.sh-body'), function (e) { return [e, e.scrollTop]; });
      stage.style.display = 'none'; void stage.offsetHeight; stage.style.display = '';
      keep.forEach(function (k) { k[0].scrollTop = k[1]; });
    }
    fit();
  }
  function caretIntoView() {
    var a = document.activeElement;
    if (!a || !a.matches || !a.matches('input,textarea')) return;
    var sc = a.closest('.sh-body'); if (!sc) return;
    var r = a.getBoundingClientRect(), c = sc.getBoundingClientRect();
    if (r.bottom > c.bottom - 24) sc.scrollTop += r.bottom - c.bottom + 24;
    else if (r.top < c.top + 16) sc.scrollTop -= c.top + 16 - r.top;
  }
  window.addEventListener('scroll', function () { window.scrollTo(0, 0); });
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', function () { fit(); setTimeout(caretIntoView, 340); });
    visualViewport.addEventListener('scroll', function () { fit(); window.scrollTo(0, 0); });
  }
  document.addEventListener('focusin', function () { [50, 250, 500].forEach(function (t) { setTimeout(function () { fit(); caretIntoView(); }, t); }); });
  document.addEventListener('focusout', function () {
    setTimeout(function () { unstick(); window.scrollTo(0, 0); }, 160);
    setTimeout(function () { fit(); window.scrollTo(0, 0); }, 550);
  });
  document.addEventListener('input', function (e) { if (e.target.matches && e.target.matches('textarea')) caretIntoView(); });
  window.addEventListener('resize', function () { maxH = Math.max(maxH, innerHeight); fit(); });
  window.addEventListener('orientationchange', function () { setTimeout(function () { maxH = innerHeight; fit(); }, 350); });
  window.addEventListener('pageshow', function () { fit(); window.scrollTo(0, 0); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') { fit(); window.scrollTo(0, 0); } });
  document.addEventListener('contextmenu', function (e) { if (!e.target.closest('input,textarea')) e.preventDefault(); });

  if (location.hash === '#debug') {
    var dbg = document.createElement('div');
    dbg.style.cssText = 'position:absolute;top:60px;left:8px;z-index:99;font:12px monospace;color:#0f0;background:#000a;padding:4px';
    document.body.appendChild(dbg);
    setInterval(function () {
      dbg.textContent = 'inner ' + innerWidth + 'x' + innerHeight + ' | screen ' + screen.width + 'x' + screen.height + ' | doc ' + document.documentElement.clientHeight;
    }, 500);
  }

  fit();
  requestAnimationFrame(function () { requestAnimationFrame(function () { root.classList.add('ready'); }); });

  renderHome(true);

  // Service worker (HTTPS gerekir)
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
