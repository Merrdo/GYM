<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Antrenman</title>
<!-- viewport-fit=cover: içerik çentik/ada ve ev çubuğu altına kadar uzanır -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0c0f13">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Antrenman">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #0c0f13;
    --surface: #151a21;
    --surface2: #1d242d;
    --line: rgba(255,255,255,.07);
    --ink: #eef1f4;
    --dim: #8b96a3;
    --accent: #d4ff3f;
    --accent-ink: #0c0f13;
    --danger: #ff6a5e;
    --accent-soft: rgba(212,255,63,.12);
    --r: 20px;    /* kart / form kartı yuvarlaklığı */
    --ease: cubic-bezier(.32,.72,0,1);
    /* Safe area kullanılmıyor: sabit boşluklar. Arka plan ve içerik uçlara kadar uzanır */
    --pt: 52px;   /* başlıkların üst boşluğu */
    --pb: 36px;   /* butonların ekran altından yüksekliği */
  }
  /* Tarayıcıda (kurulu uygulama değil) Safari kendi çubuklarını yönetir; boşluklar küçülür */
  html.browser { --pt: 24px; --pb: 20px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Tam ekran düzeni: html/body/stage yapısı korunuyor */
  html, body {
    width: 100%;
    height: var(--full-h, 100%);
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    overflow: hidden;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: var(--full-h, 100%);
    overflow: hidden;
  }
  /* Klavye açılıp kapanırken yükseklik yumuşakça değişir (ilk açılışta animasyon yok) */
  html.ready .stage { transition: height .32s cubic-bezier(.22,.9,.24,1); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, textarea { font: inherit; color: inherit; -webkit-user-select: text; user-select: text; }
  b { font-weight: 700; font-variant-numeric: tabular-nums; }

  /* ---------- Görünümler ---------- */
  .view {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    background: var(--bg);
    will-change: transform;
  }
  #group { display: none; z-index: 10; }
  #gform { display: none; z-index: 12; }
  .dim { position: absolute; inset: 0; background: rgba(0,0,0,.5); z-index: 9; pointer-events: none; }
  /* Sol kenar şeridi: tarayıcının kendi kaydırma/geri hareketini engeller, geri hareketini biz yönetiriz */
  .edge { position: absolute; left: 0; top: 0; bottom: 0; width: 18px; z-index: 60; touch-action: none; }
  html.kbd .bar { opacity: 0; transition: opacity .2s; }

  .scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 4px 20px calc(var(--pb) + 54px + 32px); }

  .top { padding: var(--pt) 20px 14px; display: flex; align-items: center; gap: 12px; flex: none; }
  .top h1 { font-size: 1.7rem; letter-spacing: -.03em; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top .sub { color: var(--dim); font-size: .85rem; margin-top: 2px; font-weight: 500; letter-spacing: 0; }
  .top .ttl { flex: 1; min-width: 0; }
  .top .ttl h1 { display: block; }
  .icon-btn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); transition: transform .15s var(--ease), background .2s; flex: none; }
  .icon-btn:active { transform: scale(.9); background: var(--surface2); }
  .icon-btn svg { width: 20px; height: 20px; }
  .eyebrow { color: var(--dim); font-size: .8rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }

  /* Buton listenin üstünde yüzer; liste ekranın en altına kadar uzanır */
  .bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 20px var(--pb); z-index: 5; pointer-events: none; }
  .bar::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--pb) + 54px + 40px); background: linear-gradient(to top, var(--bg) 35%, rgba(12,15,19,0)); z-index: -1; }
  .bar .primary { pointer-events: auto; }
  .primary {
    width: 100%; height: 54px; border-radius: 16px;
    background: var(--accent); color: var(--accent-ink);
    font-weight: 700; font-size: 1rem; letter-spacing: -.01em;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .15s var(--ease), filter .2s;
  }
  .primary:active { transform: scale(.975); filter: brightness(.92); }
  .primary svg { width: 18px; height: 18px; }
  .bar .primary:not(.sec), .form-foot .primary { box-shadow: 0 10px 28px -12px rgba(212,255,63,.5); }

  /* ---------- Kartlar ---------- */
  .card {
    width: 100%; text-align: left; display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    padding: 16px; margin-bottom: 10px;
    transition: transform .18s var(--ease), background .2s;
  }
  .card:active { transform: scale(.98); background: var(--surface2); }
  .card.in { animation: rise .5s var(--ease) both; animation-delay: calc(var(--i) * 45ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* Kare simge: grup harfi / hareket sırası */
  .tile { flex: none; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 1.05rem; font-weight: 700; background: var(--accent-soft); color: var(--accent); }
  .grp .gi { flex: 1; min-width: 0; }
  .grp .name { font-size: 1.08rem; font-weight: 650; letter-spacing: -.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grp .sub { color: var(--dim); font-size: .85rem; margin-top: 3px; }
  .grp > svg { width: 18px; height: 18px; color: var(--dim); flex: none; }

  .ex { align-items: flex-start; }
  .ex .tile { width: 32px; height: 32px; border-radius: 10px; font-size: .78rem; font-variant-numeric: tabular-nums; background: var(--surface2); color: var(--dim); }
  .ex .bd { flex: 1; min-width: 0; padding-top: 5px; }
  .ex .name { font-size: 1.05rem; font-weight: 650; letter-spacing: -.02em; line-height: 1.25; }
  .ex .desc { color: var(--dim); font-size: .88rem; line-height: 1.4; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip { background: var(--surface2); border-radius: 8px; padding: 5px 10px; font-size: .82rem; color: var(--dim); font-weight: 500; }
  .chip b { color: var(--ink); }
  .chip.main { background: rgba(212,255,63,.12); color: var(--accent); }
  .chip.main b { color: var(--accent); }

  .empty { text-align: center; color: var(--dim); padding: 12vh 32px 0; line-height: 1.5; font-size: .95rem; animation: rise .6s var(--ease) both; }
  .empty .ico { width: 64px; height: 64px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; margin: 0 auto 18px; color: var(--accent); }
  .empty .ico svg { width: 28px; height: 28px; }
  .empty h2 { color: var(--ink); font-size: 1.2rem; letter-spacing: -.02em; margin-bottom: 6px; }

  /* ---------- Tam ekran form sayfası (grup / hareket) ---------- */
  #gfBody { padding-top: 8px; padding-bottom: 28px; }
  .form-foot {
    flex: none; display: flex; flex-direction: column; gap: 8px;
    padding: 12px 20px var(--pb); border-top: 1px solid var(--line); background: var(--bg);
    transition: padding .34s cubic-bezier(.22,.8,.3,1);
  }
  html.kbd .form-foot { padding-bottom: 12px; }
  .ghost { height: 46px; border-radius: 14px; font-weight: 600; color: var(--danger); transition: background .2s, transform .15s var(--ease); }
  .ghost:active { transform: scale(.97); }
  .ghost.confirm { background: rgba(255,106,94,.14); }

  /* Yeni özellik = yeni .fsec bölümü. Bölüm: başlık (.fcap) + kart (.fcard) içinde satırlar */
  .fsec { margin-bottom: 26px; }
  .fcap { color: var(--dim); font-size: .76rem; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; padding: 0 4px 10px; }
  .fcard { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); overflow: hidden; transition: border-color .2s; }
  .fcard:has(.finput:focus) { border-color: rgba(212,255,63,.45); }
  .fcard > * + * { border-top: 1px solid var(--line); }
  .finput { display: block; width: 100%; background: none; border: 0; outline: none; resize: none; padding: 16px 18px; font-size: 1.05rem; line-height: 1.45; }
  .finput::placeholder { color: #566170; }
  textarea.finput { min-height: 104px; font-size: .96rem; }
  .frow { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; padding: 10px 12px 10px 18px; }
  .frow.seg-row { min-height: 0; padding: 8px; }
  .fl { font-weight: 600; font-size: 1rem; letter-spacing: -.01em; }
  .fl small { display: block; color: var(--dim); font-size: .78rem; font-weight: 500; letter-spacing: 0; margin-top: 2px; }
  .hide { display: none; }

  /* ---------- Hareket formu: ad + tarif ---------- */
  .stg { animation: rise .6s var(--ease) both; animation-delay: calc(120ms + var(--k, 0) * 80ms); }
  .fcard:has(.nm-in:focus, .ds-in:focus) { border-color: rgba(212,255,63,.45); }
  .fcard:has(.nm-in:focus, .ds-in:focus) { box-shadow: 0 0 0 4px rgba(212,255,63,.06); }
  .fcard { transition: border-color .2s, box-shadow .3s; }

  .nmbox { padding: 10px 18px 0; }
  .nm-field { position: relative; }
  .nm-in { display: block; width: 100%; background: none; border: 0; outline: none; padding: 26px 40px 10px 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -.03em; line-height: 1.2; caret-color: var(--accent); text-overflow: ellipsis; }
  .nm-lb { position: absolute; left: 0; top: 26px; font-size: 1.5rem; font-weight: 700; letter-spacing: -.03em; line-height: 1.2; color: #566170; pointer-events: none; transform-origin: left top; transition: transform .4s var(--ease), color .3s; white-space: nowrap; }
  .nm-in:focus + .nm-lb, .nm-in:not(:placeholder-shown) + .nm-lb { transform: translateY(-22px) scale(.5); color: var(--dim); }
  .nm-in:focus + .nm-lb { color: var(--accent); }
  .nm-ct { position: absolute; right: 0; top: 7px; font-size: .72rem; font-weight: 600; color: var(--dim); font-variant-numeric: tabular-nums; opacity: 0; transition: opacity .25s, color .25s; }
  .nm-field:focus-within .nm-ct { opacity: 1; }
  .nm-field.near .nm-ct { color: var(--danger); }
  .nm-bar { position: relative; height: 2px; border-radius: 1px; background: var(--line); overflow: hidden; }
  .nm-bar::after { content: ""; position: absolute; inset: 0; background: var(--accent); transform-origin: left center; transform: scaleX(var(--p, 0)); transition: transform .35s var(--ease), background .3s; }
  .nm-field.near .nm-bar::after { background: var(--danger); }
  .nm-in.pop { animation: nmpop .45s var(--ease); }
  @keyframes nmpop { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: none; } }

  /* Aç-kapa bölümleri: yükseklik yumuşakça değişir */
  .col { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .5s var(--ease), opacity .35s; }
  .col > div { min-height: 0; overflow: hidden; }
  .col.off { grid-template-rows: 0fr; opacity: 0; }

  .sg-row { display: flex; gap: 8px; overflow-x: auto; padding: 14px 18px 14px; margin: 0 -18px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .sg-row::-webkit-scrollbar { display: none; }
  .sgc { flex: none; height: 34px; padding: 0 14px; border-radius: 17px; background: var(--surface2); color: var(--dim); font-size: .86rem; font-weight: 600; transition: transform .15s var(--ease), background .2s, color .2s; }
  .sgc:active { transform: scale(.92); background: var(--accent-soft); color: var(--accent); }

  .ds-add { width: 100%; display: flex; align-items: center; gap: 14px; padding: 15px 18px; text-align: left; transition: background .2s; }
  .ds-add:active { background: var(--surface2); }
  .ds-add .ic { flex: none; width: 34px; height: 34px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; transition: transform .4s var(--ease); }
  .ds-add:active .ic { transform: rotate(90deg) scale(.9); }
  .ds-add .ic svg { width: 17px; height: 17px; }
  .ds-add b { display: block; font-size: 1rem; font-weight: 650; letter-spacing: -.01em; }
  .ds-add small { display: block; color: var(--dim); font-size: .78rem; font-weight: 500; margin-top: 2px; }

  .ds-in { display: block; width: 100%; background: none; border: 0; outline: none; resize: none; padding: 18px 18px 8px; font-size: .98rem; line-height: 1.55; min-height: 88px; max-height: 240px; overflow-y: auto; caret-color: var(--accent); }
  .ds-in::placeholder { color: #566170; }
  .ds-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 2px 16px 14px 14px; }
  .gcs { display: flex; flex-wrap: wrap; gap: 6px; }
  .gc { height: 30px; padding: 0 11px; border-radius: 10px; background: var(--surface2); color: var(--dim); font-size: .8rem; font-weight: 600; transition: transform .15s var(--ease), background .25s, color .25s; }
  .gc:active { transform: scale(.92); }
  .gc.used { background: var(--accent-soft); color: var(--accent); }
  .ds-ct { flex: none; font-size: .72rem; font-weight: 600; color: var(--dim); font-variant-numeric: tabular-nums; transition: color .25s; }
  .ds-ct.near { color: var(--danger); }

  /* ---------- Silme paneli ---------- */
  .icon-btn.trash { color: var(--danger); background: rgba(255,106,94,.12); }
  .icon-btn.trash:active { background: rgba(255,106,94,.22); }
  .dsh { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; background: rgba(0,0,0,.5); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); opacity: 0; pointer-events: none; transition: opacity .35s var(--ease); }
  .dsh.open { opacity: 1; pointer-events: auto; }
  .dsh-card { width: 100%; background: var(--surface); border-radius: 28px 28px 0 0; padding: 30px 20px var(--pb); text-align: center; transform: translateY(100%); transition: transform .5s var(--ease); }
  .dsh.open .dsh-card { transform: none; }
  .dsh-ico { width: 64px; height: 64px; border-radius: 22px; background: rgba(255,106,94,.12); color: var(--danger); display: grid; place-items: center; margin: 0 auto 18px; opacity: 0; transform: scale(.6); transition: transform .6s var(--ease) .12s, opacity .3s .12s; }
  .dsh.open .dsh-ico { opacity: 1; transform: none; }
  .dsh-ico svg { width: 30px; height: 30px; overflow: visible; }
  .dsh-ico .lid { transform-box: fill-box; transform-origin: 15% 100%; transition: transform .45s var(--ease) .4s; }
  .dsh.open .lid { transform: rotate(-16deg) translateY(-2px); }
  .dsh.go .lid { transform: none; transition-delay: 0s; transition-duration: .2s; }
  .dsh h2 { font-size: 1.35rem; letter-spacing: -.03em; }
  .dsh p { color: var(--dim); line-height: 1.45; margin: 8px 8px 24px; font-size: .95rem; }
  .dsh p b { color: var(--ink); font-weight: 650; }
  .dsh-row { display: flex; gap: 10px; }
  .dsh-row button { flex: 1; height: 54px; border-radius: 16px; font-weight: 700; font-size: 1rem; transition: transform .15s var(--ease), filter .2s; }
  .dsh-row button:active { transform: scale(.96); filter: brightness(.92); }
  .dsh-no { background: var(--surface2); }
  .dsh-ok { background: var(--danger); color: var(--accent-ink); box-shadow: 0 10px 28px -12px rgba(255,106,94,.55); }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }

  .seg { position: relative; width: 100%; display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); border-radius: 13px; padding: 4px; }
  .seg i { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); background: var(--surface2); border-radius: 10px; transition: transform .35s var(--ease); }
  .seg.r i { transform: translateX(100%); }
  .seg button { position: relative; z-index: 1; height: 40px; font-weight: 600; color: var(--dim); transition: color .25s; }
  .seg button.on { color: var(--ink); }

  .stepper { display: flex; align-items: center; flex: none; }
  .stepper button { width: 38px; height: 38px; border-radius: 50%; background: var(--surface2); font-size: 1.3rem; line-height: 1; display: grid; place-items: center; transition: background .15s, transform .12s var(--ease); touch-action: none; }
  .stepper button:active { background: var(--bg); transform: scale(.9); }
  .stepper .val { min-width: 88px; padding: 0 6px; text-align: center; white-space: nowrap; font-size: .95rem; color: var(--dim); font-weight: 500; }
  .stepper .val b { color: var(--ink); font-size: 1.08rem; }
  .stepper .val.pop b { animation: pop .18s var(--ease); display: inline-block; }
  @keyframes pop { from { transform: scale(1.18); } to { transform: none; } }

  /* ---------- Başlat çubuğu ---------- */
  .bar-row { display: flex; gap: 10px; }
  .bar-row .primary { flex: 1.25; }
  .bar-row .primary.sec { flex: 1; background: var(--surface2); color: var(--ink); }
  .bar-row.no-ex #startBtn { display: none; }
  .bar-row.no-ex .primary.sec { background: var(--accent); color: var(--accent-ink); }

  /* ---------- Antrenman oynatıcı ---------- */
  #player { display: none; z-index: 40; --ph: #d4ff3f; background: #0c0f13; overflow: hidden; }
  #player.is-rest { --ph: #62d6ff; }
  #player.is-prep { --ph: #eef1f4; }
  #wave { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .pl-in { position: relative; z-index: 1; flex: 1; min-height: 0; display: flex; flex-direction: column; }

  .pl-top { flex: none; padding: var(--pt) 20px 0; display: flex; align-items: center; gap: 14px; transition: opacity .5s; }
  .pl-top .icon-btn { background: rgba(255,255,255,.09); }
  .pl-segs { flex: 1; display: flex; gap: 4px; }
  .sg { flex: 1; height: 5px; border-radius: 3px; background: rgba(255,255,255,.13); overflow: hidden; }
  .sg i { display: block; width: 100%; height: 100%; border-radius: 3px; background: var(--ph); transform-origin: left center; transform: scaleX(0); transition: background .5s; }

  .pl-main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 24px; cursor: pointer; }
  .pl-c { display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%; }
  .pl-tag { color: rgba(238,241,244,.62); font-size: .95rem; font-weight: 600; min-height: 1.25em; transition: color .4s; }
  #player.paused .pl-tag { color: var(--ph); }
  .pl-name { font-size: clamp(1.8rem, 8.6vw, 2.7rem); font-weight: 760; letter-spacing: -.038em; line-height: 1.08; margin-top: 10px; max-width: 100%; text-wrap: balance; overflow-wrap: anywhere; }
  .pl-val { display: flex; justify-content: center; margin-top: 2.4vh; line-height: .95; letter-spacing: -.045em; font-weight: 700; font-variant-numeric: tabular-nums;
    font-size: min(38vw, 23vh);
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; }
  .dc { position: relative; display: inline-block; }
  .dc > span { display: inline-block; }
  .dc > span.old { position: absolute; left: 0; top: 0; }
  .pl-unit { color: rgba(238,241,244,.6); font-size: 1.05rem; font-weight: 600; margin-top: 8px; min-height: 1.3em; }
  #player.paused .pl-val { animation: plblink 1.6s ease-in-out infinite; }
  @keyframes plblink { 50% { opacity: .35; } }

  .pl-pills { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; margin-top: 3.2vh; min-height: 8px; max-width: 280px; }
  .pp { position: relative; width: 22px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; }
  .pp.on { width: 46px; }
  .pp u { position: absolute; inset: 0; background: var(--ph); transform-origin: left center; transform: scaleX(0); text-decoration: none; }
  .pp.done u { transform: scaleX(1); }
  .pl-setx { font-weight: 650; font-size: .95rem; color: rgba(238,241,244,.8); }

  .pl-foot { margin-top: 3.2vh; max-width: 32ch; }
  .pl-desc { color: rgba(238,241,244,.62); font-size: .95rem; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .pl-next { background: rgba(21,26,33,.72); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-radius: 18px; padding: 14px 20px 16px; min-width: 230px; }
  .pl-next small { display: block; color: var(--dim); font-size: .82rem; font-weight: 600; }
  .pl-next strong { display: block; font-size: 1.12rem; letter-spacing: -.02em; margin: 3px 0 10px; }
  .pl-next .chips, .pl-foot > .chips { justify-content: center; margin-top: 0; }

  .pl-ctl { flex: none; padding: 0 20px var(--pb); display: flex; flex-direction: column; align-items: center; gap: 18px; transition: opacity .5s; }
  .pl-add { height: 42px; padding: 0 20px; border-radius: 21px; background: rgba(255,255,255,.11); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); font-weight: 650; font-size: .95rem;
    opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .35s var(--ease), transform .35s var(--ease); }
  #player.is-rest .pl-add { opacity: 1; transform: none; pointer-events: auto; }
  .pl-add:active { transform: scale(.94); }
  .pl-row { display: flex; align-items: center; justify-content: center; gap: 14px; width: 100%; }
  .rb { width: 58px; height: 58px; border-radius: 50%; background: rgba(255,255,255,.07); display: grid; place-items: center; flex: none; transition: transform .15s var(--ease), background .2s; }
  .rb svg { width: 24px; height: 24px; }
  .rb:active { transform: scale(.86); background: rgba(255,255,255,.14); }
  .mb { height: 88px; width: 88px; border-radius: 44px; background: var(--ph); color: #0c0f13; display: flex; align-items: center; justify-content: center; gap: 8px; flex: none;
    font-weight: 750; font-size: 1.05rem; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; box-shadow: 0 10px 40px -10px var(--ph);
    transition: width .55s var(--ease), background .5s, box-shadow .5s, transform .15s var(--ease); }
  .mb:active { transform: scale(.93); }
  .mb svg { width: 32px; height: 32px; flex: none; }
  .pl-ctl.reps .mb { width: min(152px, 40vw); }
  .pl-ctl.reps .mb svg { width: 26px; height: 26px; }
  #player.is-done .pl-ctl, #player.is-done .pl-main, #player.is-done .pl-top { opacity: 0; pointer-events: none; }

  .pl-quit { position: absolute; inset: 0; z-index: 5; display: flex; align-items: flex-end; background: rgba(0,0,0,.55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity .3s var(--ease); }
  .pl-quit.open { opacity: 1; pointer-events: auto; }
  .q-card { width: 100%; background: var(--surface); border-radius: 26px 26px 0 0; padding: 26px 20px var(--pb); display: flex; flex-direction: column; gap: 8px; transform: translateY(100%); transition: transform .45s var(--ease); }
  .pl-quit.open .q-card { transform: none; }
  .q-card h2 { font-size: 1.3rem; letter-spacing: -.02em; }
  .q-card p { color: var(--dim); line-height: 1.4; margin-bottom: 14px; }

  .pl-done { position: absolute; inset: 0; z-index: 3; display: none; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); padding: 0 28px var(--pb); text-align: center; opacity: 0; transition: opacity .6s var(--ease); --num: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; }
  .pl-done.go { opacity: 1; }
  .pl-done .badge { position: relative; width: 132px; height: 132px; display: grid; place-items: center; margin-bottom: 26px; }
  .pl-done .badge svg { width: 100%; height: 100%; overflow: visible; position: relative; }
  .pl-done .wave { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; }
  .pl-done.go .wave { animation: dwave 2.6s var(--ease) infinite; }
  .pl-done.go .wave:nth-child(2) { animation-delay: .85s; }
  .pl-done.go .wave:nth-child(3) { animation-delay: 1.7s; }
  @keyframes dwave { 0% { transform: scale(.8); opacity: .5; } 100% { transform: scale(2.1); opacity: 0; } }
  .d-ring { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 302; stroke-dashoffset: 302; }
  .d-chk { fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 70; stroke-dashoffset: 70; }
  .d-trk { fill: none; stroke: rgba(255,255,255,.07); stroke-width: 5; }
  .pl-done.go .d-ring { animation: draw 1s var(--ease) .2s forwards; }
  .pl-done.go .d-chk { animation: draw .6s var(--ease) .85s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .pl-done h2 { font-family: var(--num); font-size: 2.1rem; letter-spacing: -.04em; font-weight: 750; }
  .pl-done .gname { color: var(--dim); margin-top: 6px; font-weight: 500; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-done .rise { opacity: 0; transform: translateY(16px); }
  .pl-done.go .rise { animation: rise .7s var(--ease) both; animation-delay: calc(.9s + var(--k) * 90ms); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 360px; margin: 30px 0 28px; }
  .stat { background: var(--surface); border-radius: 18px; padding: 16px 8px; }
  .stat .v { font-family: var(--num); font-size: 1.55rem; font-weight: 700; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
  .stat .l { color: var(--dim); font-size: .7rem; font-weight: 650; letter-spacing: .12em; text-transform: uppercase; margin-top: 4px; }
  .pl-done .primary { flex: none; max-width: 360px; }
  @media (orientation: landscape) and (max-height: 520px) {
    .pl-done { padding: 12px 28px 14px; }
    .pl-done .badge { width: 72px; height: 72px; margin-bottom: 10px; }
    .pl-done h2 { font-size: 1.5rem; }
    .stats { margin: 12px 0; }
    .stat { padding: 8px 6px; }
    .stat .v { font-size: 1.2rem; }
    .pl-done .primary { height: 46px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">

  <!-- Ana ekran: gruplar -->
  <section class="view" id="home">
    <div class="top">
      <div class="ttl">
        <div class="eyebrow">Antrenman</div>
        <h1>Gruplarım</h1>
        <div class="sub" id="hSub"></div>
      </div>
    </div>
    <div class="scroll" id="homeList"></div>
    <div class="bar">
      <button class="primary" id="addGroup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Yeni grup</button>
    </div>
  </section>

  <!-- Grup ekranı: hareketler -->
  <section class="view" id="group">
    <div class="top">
      <button class="icon-btn" id="back" aria-label="Geri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="ttl"><h1 id="gTitle"></h1><div class="sub" id="gSub"></div></div>
      <button class="icon-btn" id="editGroup" aria-label="Grubu düzenle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 00-4-4L4 16v4z"/></svg></button>
    </div>
    <div class="scroll" id="groupList"></div>
    <div class="bar">
      <div class="bar-row" id="barRow">
        <button class="primary sec" id="addEx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Hareket ekle</button>
        <button class="primary" id="startBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.6v12.8a1 1 0 001.5.86l10.4-6.4a1 1 0 000-1.72L9.5 4.74A1 1 0 008 5.6z"/></svg>Başlat</button>
      </div>
    </div>
  </section>


  <!-- Antrenman oynatıcı -->
  <section class="view" id="player" aria-label="Antrenman">
    <canvas id="wave"></canvas>
    <div class="pl-in">
      <div class="pl-top">
        <button class="icon-btn" id="plClose" aria-label="Antrenmanı bitir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <div class="pl-segs" id="plSegs"></div>
        <button class="icon-btn" id="plSnd" aria-label="Sesi aç veya kapat"></button>
      </div>
      <div class="pl-main" id="plMain">
        <div class="pl-c" id="plC">
          <div class="pl-tag" id="plTag"></div>
          <h1 class="pl-name" id="plName"></h1>
          <div class="pl-val" id="plVal"></div>
          <div class="pl-unit" id="plUnit"></div>
          <div class="pl-pills" id="plPills"></div>
          <div class="pl-foot" id="plFoot"></div>
        </div>
      </div>
      <div class="pl-ctl" id="plCtl">
        <button class="pl-add" id="plAdd">+15 sn</button>
        <div class="pl-row">
          <button class="rb" id="plPrev" aria-label="Önceki"></button>
          <button class="mb" id="plMb"></button>
          <button class="rb" id="plNext" aria-label="Atla"></button>
        </div>
      </div>
    </div>
    <div class="pl-done" id="plDone">
      <div class="badge">
        <span class="wave"></span><span class="wave"></span><span class="wave"></span>
        <svg viewBox="0 0 120 120"><circle class="d-trk" cx="60" cy="60" r="48"/><circle class="d-ring" cx="60" cy="60" r="48" transform="rotate(-90 60 60)"/><path class="d-chk" d="M38 62l16 16 28-34"/></svg>
      </div>
      <h2 class="rise" style="--k:0">Tamamlandı</h2>
      <div class="gname rise" style="--k:1" id="dnGroup"></div>
      <div class="stats rise" style="--k:2">
        <div class="stat"><div class="v" id="dnTime"></div><div class="l">Süre</div></div>
        <div class="stat"><div class="v" id="dnEx"></div><div class="l">Hareket</div></div>
        <div class="stat"><div class="v" id="dnSets"></div><div class="l">Set</div></div>
      </div>
      <button class="primary rise" style="--k:3;width:100%" id="dnBtn">Bitir</button>
    </div>
    <div class="pl-quit" id="plQuit">
      <div class="q-card">
        <h2>Antrenman bitsin mi?</h2>
        <p id="qInfo"></p>
        <button class="primary" id="qKeep">Devam et</button>
        <button class="ghost" id="qEnd">Bitir</button>
      </div>
    </div>
  </section>

  <!-- Form sayfası: grup ve hareket ekleme/düzenleme (tam ekran) -->
  <section class="view" id="gform" role="dialog" aria-modal="true" aria-labelledby="gfTitle">
    <div class="top">
      <button class="icon-btn" id="gfClose" aria-label="Kapat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="ttl"><div class="eyebrow" id="gfEyebrow">Grup</div><h1 id="gfTitle"></h1></div>
      <button class="icon-btn trash hide" id="gfTrash" aria-label="Sil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 8l1 11a2 2 0 002 1.8h7a2 2 0 002-1.8l1-11"/><path d="M10 12v5M14 12v5"/><g class="lid"><path d="M4 7.5h16"/><path d="M9 7.5V5.5a1 1 0 011-1h4a1 1 0 011 1v2"/></g></svg></button>
    </div>
    <div class="scroll" id="gfBody"></div>
    <div class="form-foot" id="gfFoot"></div>
    <div class="dsh" id="dsh">
      <div class="dsh-card" role="alertdialog" aria-labelledby="dshT">
        <div class="dsh-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 8l1 11a2 2 0 002 1.8h7a2 2 0 002-1.8l1-11"/><path d="M10 12v5M14 12v5"/><g class="lid"><path d="M4 7.5h16"/><path d="M9 7.5V5.5a1 1 0 011-1h4a1 1 0 011 1v2"/></g></svg></div>
        <h2 id="dshT"></h2>
        <p id="dshP"></p>
        <div class="dsh-row"><button class="dsh-no" id="dshNo">Vazgeç</button><button class="dsh-ok" id="dshOk">Sil</button></div>
      </div>
    </div>
  </section>

</div>

<script>
(function () {
  /* ================= Veri ================= */
  var KEY = 'antrenman.v1';
  var state = load();
  function load() {
    try { var d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.groups)) return d; } catch (e) {}
    return { groups: [] };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function findGroup(id) { return state.groups.filter(function (g) { return g.id === id; })[0]; }

  /* ================= Biçimlendirme ================= */
  function fmtTime(s) {
    var m = Math.floor(s / 60), r = s % 60;
    if (m && r) return m + ' dk ' + r + ' sn';
    if (m) return m + ' dk';
    return r + ' sn';
  }
  function bold(t) { return String(t).replace(/(\d+)/g, '<b>$1</b>'); }
  var CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';

  /* ================= Ekranlar ================= */
  var stage = $('#stage'), curId = null;

  function renderHome(animate) {
    var el = $('#homeList');
    var nEx = state.groups.reduce(function (a, g) { return a + g.exercises.length; }, 0);
    $('#hSub').textContent = state.groups.length ? state.groups.length + ' grup · ' + nEx + ' hareket' : '';
    if (!state.groups.length) {
      el.innerHTML = '<div class="empty"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg></span><h2>Henüz grup yok</h2>Antrenmanını gruplara ayır.<br>Örn. “Üst vücut” veya “Sabah esneme”.</div>';
      return;
    }
    el.innerHTML = state.groups.map(function (g, i) {
      var sets = g.exercises.reduce(function (a, e) { return a + e.sets; }, 0);
      var sub = g.exercises.length ? g.exercises.length + ' hareket · ' + sets + ' set' : 'Henüz hareket yok';
      return '<button class="card grp' + (animate ? ' in' : '') + '" data-id="' + g.id + '" style="--i:' + i + '"><span class="tile">' + esc(Array.from(g.name.trim())[0].toLocaleUpperCase('tr')) + '</span><div class="gi"><div class="name">' + esc(g.name) + '</div><div class="sub">' + sub + '</div></div>' + CHEV + '</button>';
    }).join('');
  }

  function renderGroup(animate) {
    var g = findGroup(curId); if (!g) return;
    $('#gTitle').textContent = g.name;
    var sets = g.exercises.reduce(function (a, e) { return a + e.sets; }, 0);
    $('#gSub').textContent = g.exercises.length ? g.exercises.length + ' hareket · ' + sets + ' set' : 'Henüz hareket yok';
    $('#barRow').classList.toggle('no-ex', !g.exercises.length);
    var el = $('#groupList');
    if (!g.exercises.length) {
      el.innerHTML = '<div class="empty"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></span><h2>Bu grup boş</h2>İlk hareketini ekleyerek başla.</div>';
      return;
    }
    el.innerHTML = g.exercises.map(function (e, i) {
      var main = e.type === 'time' ? fmtTime(e.value) : e.value + ' tekrar';
      var chips = '<span class="chip main">' + bold(main) + '</span><span class="chip">' + bold(e.sets + ' set') + '</span>';
      if (e.rest > 0) chips += '<span class="chip">' + bold(fmtTime(e.rest)) + ' dinlenme</span>';
      return '<button class="card ex' + (animate ? ' in' : '') + '" data-id="' + e.id + '" style="--i:' + i + '">' +
        '<span class="tile">' + String(i + 1).padStart(2, '0') + '</span><div class="bd"><div class="name">' + esc(e.name) + '</div>' +
        (e.desc ? '<div class="desc">' + esc(e.desc) + '</div>' : '') + '<div class="chips">' + chips + '</div></div></button>';
    }).join('');
  }

  /* ================= Sayfa geçişleri (Web Animations) ================= */
  var EASE = 'cubic-bezier(.22,.9,.24,1)';
  var homeView = $('#home'), groupView = $('#group'), groupOpen = false, dimEl = null, homeAnim = null;

  function openGroup(id) {
    curId = id; renderGroup(true);
    $('#groupList').scrollTop = 0;
    groupView.style.display = 'flex';
    dimEl = document.createElement('div'); dimEl.className = 'dim';
    stage.insertBefore(dimEl, groupView);
    dimEl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 480, easing: EASE });
    groupView.animate([{ transform: 'translateX(100%)' }, { transform: 'none' }], { duration: 480, easing: EASE });
    homeAnim = homeView.animate([{ transform: 'none' }, { transform: 'translateX(-22%)' }], { duration: 480, easing: EASE, fill: 'forwards' });
    homeView.inert = true; groupOpen = true;
  }
  function closeGroup(from, pf, dimFrom) {
    if (!groupOpen) return;
    groupOpen = false;
    var a = groupView.animate([{ transform: from || 'none' }, { transform: 'translateX(100%)' }], { duration: 400, easing: EASE, fill: 'forwards' });
    homeView.animate([{ transform: pf || 'translateX(-22%)' }, { transform: 'none' }], { duration: 400, easing: EASE });
    if (homeAnim) { homeAnim.cancel(); homeAnim = null; }
    var d = dimEl; dimEl = null;
    if (d) d.animate([{ opacity: dimFrom == null ? 1 : dimFrom }, { opacity: 0 }], { duration: 400, easing: EASE, fill: 'forwards' }).onfinish = function () { d.remove(); };
    homeView.inert = false;
    a.onfinish = function () { groupView.style.display = 'none'; a.cancel(); };
  }

  // Soldan çekerek geri: sayfa parmağı takip eder, alttaki sayfa hafifçe paralaks yapar
  (function () {
    var strip = document.createElement('div'); strip.className = 'edge'; groupView.appendChild(strip);
    var sx = null, dx = 0, t0 = 0, W = 1;
    function prevT(p) { return 'translate3d(' + (-0.22 * W * (1 - p)) + 'px,0,0)'; }
    strip.addEventListener('touchstart', function (e) {
      if (!groupOpen || formOpen || sx != null) return;
      sx = e.touches[0].clientX; dx = 0; t0 = Date.now(); W = groupView.offsetWidth || innerWidth;
      if (homeAnim) { homeAnim.cancel(); homeAnim = null; }
      homeView.style.transform = prevT(0);
    }, { passive: true });
    strip.addEventListener('touchmove', function (e) {
      if (sx == null) return;
      dx = Math.min(W, Math.max(0, e.touches[0].clientX - sx)); var p = dx / W;
      groupView.style.transform = 'translate3d(' + dx + 'px,0,0)';
      homeView.style.transform = prevT(p);
      if (dimEl) dimEl.style.opacity = 1 - p;
    }, { passive: true });
    function end(cancel) {
      if (sx == null) return;
      var v = dx / Math.max(1, Date.now() - t0), p = dx / W; sx = null;
      var from = 'translate3d(' + dx + 'px,0,0)', pf = prevT(p);
      groupView.style.transform = ''; homeView.style.transform = '';
      if (dimEl) dimEl.style.opacity = '';
      if (!cancel && (dx > W * .33 || v > .6)) { closeGroup(from, pf, 1 - p); }
      else {
        if (dx > 0) groupView.animate([{ transform: from }, { transform: 'none' }], { duration: 320, easing: EASE });
        homeAnim = homeView.animate([{ transform: pf }, { transform: 'translateX(-22%)' }], { duration: 320, easing: EASE, fill: 'forwards' });
        if (dimEl) dimEl.animate([{ opacity: 1 - p }, { opacity: 1 }], { duration: 320, easing: EASE });
      }
    }
    strip.addEventListener('touchend', function () { end(false); });
    strip.addEventListener('touchcancel', function () { end(true); });
  })();

  // Enter tuşu klavyeyi kapatır
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); e.target.blur(); }
  });

  function needName(inp) {
    var box = inp.closest('.fcard') || inp;
    box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); inp.focus();
  }

  /* ----- Tam ekran form sayfası ----- */
  var formView = $('#gform'), formOpen = false, formSave = null, formOff = [];
  // Form içi dinleyiciler kapanınca otomatik temizlenir
  function fOn(t, type, fn, opt) { t.addEventListener(type, fn, opt); formOff.push(function () { t.removeEventListener(type, fn, opt); }); }

  function openForm(eyebrow, title, bodyHTML, saveLabel, delLabel, onDelete, delMsg) {
    if (formOpen) return;
    var eb = $('#gfEyebrow'); eb.textContent = eyebrow || ''; eb.style.display = eyebrow ? '' : 'none';
    $('#gfTitle').textContent = title;
    $('#gfBody').innerHTML = bodyHTML;
    $('#gfBody').scrollTop = 0;
    var foot = '<button class="primary" id="gfSave">' + saveLabel + '</button>';
    $('#gfFoot').innerHTML = foot;
    $('#gfSave').onclick = function () { if (formSave) formSave(); };
    var tr = $('#gfTrash'), sh = $('#dsh');
    tr.classList.toggle('hide', !delLabel);
    if (delLabel) {
      $('#dshT').textContent = delLabel + '?';
      $('#dshP').innerHTML = delMsg || 'Bu işlem geri alınamaz.';
      tr.onclick = function () {
        if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
        sh.classList.remove('go'); sh.classList.add('open');
      };
      $('#dshNo').onclick = closeSheet;
      sh.onclick = function (e) { if (e.target === sh) closeSheet(); };
      $('#dshOk').onclick = function () {
        sh.classList.add('go');
        setTimeout(onDelete, 260);

  /* ----- Dalga ----- */

  function targetLevel(now) {

  function frame(now) {
